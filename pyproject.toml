[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-rag"
version = "0.1.0"
description = "Base RAG locale de code source, interrogeable par GitHub Copilot via un serveur MCP"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2,<3",
    "chromadb>=0.6,<2",
    "sentence-transformers>=3.0",
    "pyyaml>=6.0",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
copilot-rag-ingest = "copilot_rag.ingest:main"
copilot-rag-server = "copilot_rag.server:main"

[tool.setuptools.packages.find]
where = ["src"]
